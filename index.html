/* Layout: a cool-grey workbench. Editors stack on the left, a real-looking browser sits on the right with the console drawer under it. */
:root {
  --ground: #E8EBF1;
  --panel: #FFFFFF;
  --panel-2: #F5F6F9;
  --line: #D8DCE5;
  --line-2: #C3C9D6;
  --ink: #1B2030;
  --ink-2: #565E75;
  --ink-3: #868DA2;
  --fox: #DD5510;
  --fox-2: #B9450A;
  --fox-soft: #FCE7DA;
  --on-fox: #FFFFFF;
  --go: #16825A;
  --go-2: #106A48;
  --go-soft: #DDF3E8;
  --on-go: #FFFFFF;
  --err: #CF3439;
  --err-soft: #FBE6E6;

  --lang-js: #B98C00;
  --lang-md: #6A55C9;
  --code-bg: #FFFFFF;
  --gutter-bg: #F7F8FB;
  --gutter-ink: #A1A7B7;
  --active-line: #F4F6FB;
  --selection: #D5E2FF;
  --cursor: #DD5510;
  --flash: #FFE7A3;
  --t-tag: #BF3E0A;
  --t-attr: #7A3BD8;
  --t-string: #0D7A4C;

  --shadow: 0 1px 2px rgb(20 26 40 / .06), 0 4px 14px rgb(20 26 40 / .07);

html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 14px;
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--fox); outline-offset: 2px; }
kbd { font-family: var(--f-code); font-size: 11px; }

.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 12px;
  gap: 10px;
}

/* ---------- Top bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 56px;
  padding-top: 4px;
}
.brand { display: flex; align-items: center; gap: 8px; flex: none; }
.brand svg { width: 30px; height: 30px; display: block; }
.wordmark {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 24px;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.wordmark b { color: var(--fox); font-weight: 600; }
.proj { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 0 1 260px; }
.proj-name {
  min-width: 0; width: 100%;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 8px;

.tools {

/* ---------- Menus ---------- */

/* ---------- Workspace ---------- */
.workspace {

}

/* Project modes: a web page (HTML, CSS, JS) or a Markdown document (Markdown, CSS) */
.app[data-mode="md"] .pane[data-lang="html"], .app[data-mode="md"] .pane[data-lang="js"],
.app[data-mode="md"] [data-tab="html"], .app[data-mode="md"] [data-tab="js"],

.badges { display: inline-flex; gap: 4px; margin-left: 2px; }

/* Splitters */

.gutter-v:hover::after, .gutter-h:hover::after, .gutter-v:focus-visible::after, .gutter-h:focus-visible::after, .dragging .gutter-v::after, .dragging .gutter-h::after { opacity: 1; background: var(--fox); }
.dragging, .dragging * { user-select: none; }

/* ---------- CodeMirror theme ---------- */

}

.cm-s-default .cm-keyword { color: var(--t-keyword); font-weight: 500; }
.cm-s-default .cm-comment { color: var(--t-comment); font-style: italic; }
.cm-s-default .cm-property { color: var(--t-prop); }
.cm-s-default .cm-def { color: var(--t-def); }
.cm-s-default .cm-variable { color: var(--t-var); }
.cm-s-default .cm-variable-2 { color: var(--t-prop); }
.cm-s-default .cm-variable-3, .cm-s-default .cm-type { color: var(--t-def); }
.cm-s-default .cm-builtin { color: var(--t-builtin); }
.cm-s-default .cm-meta { color: var(--t-meta); }
.cm-s-default .cm-bracket { color: var(--t-bracket); }
.cm-s-default .cm-qualifier { color: var(--t-qualifier); }
.cm-s-default .cm-operator { color: var(--ink-2); }
.cm-s-default .cm-error { color: var(--err); }
.cm-s-default .cm-header { color: var(--t-keyword); }
.flash-line { background: var(--flash) !important; transition: background .3s; }
.err-line { background: color-mix(in srgb, var(--err) 9%, transparent); }

/* Lint marks */
.CodeMirror-lint-markers { width: 14px; }
.CodeMirror-lint-marker-error, .CodeMirror-lint-marker-warning, .CodeMirror-lint-marker-info, .CodeMirror-lint-marker-multiple { background: none; width: 14px; height: 14px; display: grid; place-items: center; cursor: help; }
.CodeMirror-lint-marker-error::before, .CodeMirror-lint-marker-warning::before, .CodeMirror-lint-marker-info::before { content: ""; width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; }
.CodeMirror-lint-marker-error::before { background: var(--err); }

.CodeMirror-lint-mark-info { text-decoration-color: color-mix(in srgb, var(--info) 60%, transparent); text-decoration-style: dotted; }
.CodeMirror-lint-tooltip {

  box-shadow: var(--shadow-pop); font-family: var(--f-ui); font-size: 13px; padding: 8px 10px; max-width: 380px; z-index: 200;
}
.CodeMirror-lint-message { background: none !important; padding-left: 16px; position: relative; white-space: pre-wrap; line-height: 1.45; }
.CodeMirror-lint-message + .CodeMirror-lint-message { margin-top: 6px; }
.CodeMirror-lint-message::before { content: ""; position: absolute; left: 0; top: 6px; width: 8px; height: 8px; border-radius: 50%; }
.CodeMirror-lint-message-error::before { background: var(--err); }
.CodeMirror-lint-message-warning::before { background: var(--warn); }

/* Hints */
.CodeMirror-hints {
  font-family: var(--f-code); font-size: calc(var(--code-size) - 1px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
  box-shadow: var(--shadow-pop); padding: 4px; max-height: 15em; z-index: 300;
}
.CodeMirror-hint { color: var(--ink); padding: 3px 8px; border-radius: 5px; display: flex; gap: 14px; justify-content: space-between; align-items: baseline; }
li.CodeMirror-hint-active { background: var(--fox); color: var(--on-fox); }
.hint-kind { font-family: var(--f-ui); font-size: 11px; color: var(--ink-3); }
li.CodeMirror-hint-active .hint-kind { color: inherit; opacity: .8; }

/* ---------- Browser ---------- */
.browser {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--panel-2);
  overflow: hidden;
  box-shadow: var(--shadow);
}

  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 12px;
  border-radius: 99px;

}

.status-pill[data-state="blocked"]::before { background: var(--err); }
.stage { flex: 1; min-height: 0; position: relative; overflow: hidden; background: var(--ground); display: flex; justify-content: center; }
.frame-wrap { position: absolute; top: 0; left: 50%; transform-origin: top center; background: #fff; }
.frame-wrap.device { box-shadow: 0 0 0 1px var(--line-2), var(--shadow); border-radius: 6px; overflow: hidden; top: 12px; }
.frame-wrap iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
.size-tag { position: absolute; right: 8px; bottom: 8px; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; background: var(--panel); color: var(--ink-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; pointer-events: none; opacity: .92; }

/* ---------- Console ---------- */
.console {
  height: var(--con);
  flex: none;
  display: flex; flex-direction: column;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--panel);
  overflow: hidden;
  box-shadow: var(--shadow);
  min-height: 0;
}
.console-head { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 4px; border-bottom: 1px solid var(--line); background: var(--panel-2); flex: none; }
.ctabs { display: flex; gap: 2px; }
.ctabs button { border: 0; background: transparent; height: 28px; padding: 0 10px; border-radius: 6px; font-weight: 600; font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.ctabs button:hover { color: var(--ink); }
.ctabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.count { font-size: 11px; min-width: 18px; padding: 0 5px; line-height: 18px; text-align: center; border-radius: 99px; background: var(--line); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.count:empty { display: none; }
.count.err { background: var(--err); color: #fff; }
.count.warn { background: var(--warn); color: #fff; }
.console-head .spacer { flex: 1; }
.console-body { flex: 1; min-height: 0; overflow: auto; font-family: var(--f-code); font-size: 12.5px; }
.log-row { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px; padding: 5px 10px; border-bottom: 1px solid var(--line); align-items: start; }
.log-row .ico { width: 14px; height: 14px; margin-top: 2px; color: var(--ink-3); }
.log-row .msg { white-space: pre-wrap; word-break: break-word; min-width: 0; line-height: 1.5; }
.log-row .msg > span + span { margin-left: 0.6em; }
.log-row .meta { display: flex; gap: 6px; align-items: center; }
.log-row .rep { font-family: var(--f-ui); font-size: 11px; font-weight: 700; background: var(--line); color: var(--ink-2); border-radius: 99px; padding: 0 6px; line-height: 17px; }
.src-link { font-family: var(--f-ui); font-size: 12px; font-weight: 600; border: 0; background: transparent; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 2px; padding: 0; white-space: nowrap; }
.src-link:hover { color: var(--fox); text-decoration-color: currentColor; }
.lvl-warn { background: var(--warn-soft); }
.lvl-warn .ico { color: var(--warn); }
.lvl-error { background: var(--err-soft); color: var(--err); }
.lvl-error .ico { color: var(--err); }
.lvl-info .ico { color: var(--info); }
.lvl-loop { background: var(--warn-soft); }
.lvl-loop .ico { color: var(--warn); }
.lvl-input .msg { color: var(--ink-2); }
.lvl-result .msg { color: var(--ink-2); }
.tip { grid-column: 2 / -1; font-family: var(--f-ui); font-size: 13px; color: var(--ink); line-height: 1.45; display: flex; gap: 6px; }
.tip b { color: var(--fox); font-weight: 700; flex: none; }
.k-str { color: var(--ink); }
.k-num, .k-bool { color: var(--t-number); }
.k-nil { color: var(--ink-3); }
.k-obj { color: var(--t-prop); }
.lvl-error .k-str { color: var(--err); }
.log-divider { font-family: var(--f-ui); font-size: 11px; color: var(--ink-3); text-align: center; padding: 4px; border-bottom: 1px solid var(--line); }
.empty { font-family: var(--f-ui); color: var(--ink-3); padding: 14px 12px; font-size: 13px; line-height: 1.5; }
.empty code { font-family: var(--f-code); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--ink-2); }
.prob-group { font-family: var(--f-ui); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 8px 10px 4px; border-bottom: 1px solid var(--line); }
.prob-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; padding: 7px 10px; border: 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; background: transparent; font-family: var(--f-ui); font-size: 13px; align-items: start; }
.prob-row:hover { background: var(--panel-2); }
.prob-row .sev { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; }
.prob-row .sev.error { background: var(--err); }
.prob-row .sev.warning { background: var(--warn); }
.prob-row .sev.info { background: var(--info); }
.prob-row .pmsg { line-height: 1.45; min-width: 0; overflow-wrap: anywhere; }
.prob-row .ptip { display: block; color: var(--ink-2); font-size: 12.5px; }
.prob-row .ploc { font-family: var(--f-code); font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.repl { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 0 10px; flex: none; background: var(--panel); }
.repl .prompt { color: var(--fox); font-family: var(--f-code); font-weight: 700; }
.repl input { flex: 1; min-width: 0; border: 0; background: transparent; height: 32px; font-family: var(--f-code); font-size: 12.5px; outline: none; }
.repl input::placeholder { color: var(--ink-3); }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 20px); opacity: 0;
  background: var(--ink); color: var(--panel);
  padding: 9px 16px; border-radius: 10px; font-weight: 600; font-size: 13.5px;
  box-shadow: var(--shadow-pop); pointer-events: none; z-index: 400;
  transition: opacity .18s, transform .18s; max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.fatal { padding: 24px; line-height: 1.6; color: var(--ink-2); }
.fatal strong { color: var(--ink); }

/* ---------- Mobile ---------- */
.mobile-nav { display: none; }
@media (max-width: 820px) {
  .topbar { flex-wrap: wrap; gap: 6px 10px; min-height: 0; padding-top: 8px; }
  .proj { flex: 1 1 140px; }
  .tools { flex: 1 0 100%; margin-left: 0; }
  .btn-run kbd, .hide-sm { display: none; }
  .workspace { display: flex; flex-direction: column; }
  .gutter-v, .gutter-h { display: none; }
  .editors, .output { flex: 1; min-height: 0; }
  .tabstrip, .app[data-layout="tabs"] .tabstrip { display: none; }
  .app .pane { display: none; }
  .app .pane.mactive { display: flex; flex: 1 1 0; }
  .app .pane.mactive .pane-body { display: block; }
  .pane-toggle { display: none; }
  .app[data-mview="result"] .editors { display: none; }
  .app:not([data-mview="result"]) .output { display: none; }
  .output { gap: 8px; }
  .console { height: 38%; }
  .mobile-nav {
    display: flex; gap: 4px; flex: none; padding: 4px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow);
    margin-bottom: env(safe-area-inset-bottom, 0px);
  }
  .mobile-nav button { flex: 1; height: 38px; border: 0; border-radius: 9px; background: transparent; font-weight: 700; font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .mobile-nav button[aria-selected="true"] { background: var(--panel-2); color: var(--ink); }
  .mobile-nav .mcount { min-width: 16px; line-height: 16px; font-size: 10.5px; border-radius: 99px; background: var(--err); color: #fff; padding: 0 4px; }
  .mobile-nav .mcount.warn { background: var(--warn); }
  .mobile-nav .mcount:empty { display: none; }
  .addr-title, .status-pill span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

  show();
});

  count = 0;

});

  js:
`const canvas = document.querySelector('#stage');
const ctx = canvas.getContext('2d');

let x = 60;
let y = 60;
let dx = 3;          // speed across
let dy = 2;          // speed down
const radius = 20;
let colour = '#ff7b35';

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = colour;
  ctx.fill();

  // Bounce off the walls
  if (x + radius > canvas.width || x - radius < 0) dx = -dx;
  if (y + radius > canvas.height || y - radius < 0) dy = -dy;

  x = x + dx;
  y = y + dy;

  requestAnimationFrame(draw);   // ask for the next frame
}

canvas.addEventListener('click', function () {
  const hue = Math.floor(Math.random() * 360);
  colour = \`hsl(\${hue} 90% 60%)\`;
});

draw();
`

    const host = $(`[data-badges="${lang}"]`);

    if (c.w) h += `<button class="badge warn" data-jump="${lang}" title="Show ${LANG_NAME[lang]} warnings">${c.w} warning${c.w > 1 ? 's' : ''}</button>`;
    if (!c.e && !c.w && editors[lang] && editors[lang].getValue().trim()) h = `<span class="badge ok" title="No problems found">No problems</span>`;

    const t = $(`[data-tcount="${lang}"]`);
    t.textContent = c.e || c.w || '';
    t.className = 'tcount' + (c.e ? ' err' : c.w ? ' warn' : '');

    return;

    const l = problems[lang].slice().sort((a, b) => a.line - b.line);

    l.forEach(p => {
      h += `<button class="prob-row" data-goto="${lang}:${p.line}:${p.col}"><span class="sev ${p.severity}"></span><span class="pmsg">${esc(p.msg)}${p.tip ? `<span class="ptip">${esc(p.tip)}</span>` : ''}</span><span class="ploc">line ${p.line}</span></button>`;

const EXPLAIN = [
  [/(?:ReferenceError: )?(?:Can't find variable: )?([\w$]+) is not defined/, m => `JavaScript doesn’t know what “${m[1]}” is. Check the spelling and capital letters, or create it first with let, const or function.`],
  [/Can't find variable: ([\w$]+)/, m => `JavaScript doesn’t know what “${m[1]}” is. Check the spelling and capital letters, or create it first with let or const.`],
  [/Cannot (?:read|set) propert(?:y|ies) of (null|undefined)(?: \((?:reading|setting) '([^']+)'\))?/, m => `You used .${m[2] || '…'} on something that is ${m[1]}. ` + (m[1] === 'null' ? 'Often querySelector found nothing: check the selector matches an element in your HTML (# for an id, . for a class).' : 'Check the variable has been given a value first.')],
  [/(null|undefined) is not an object \(evaluating '([^']+)'\)/, m => `${m[2]} is ${m[1]}. If it came from querySelector, check the selector matches an element in your HTML.`],
  [/([\w$.\[\]'"]+) is not a function/, m => `“${m[1]}” can’t be called like a function. Check the spelling (for example getElementById or addEventListener) and that it really is a function.`],
  [/Assignment to constant variable/, () => 'You tried to change a const. Use let instead if the value needs to change.'],
  [/Identifier '([^']+)' has already been declared/, m => `“${m[1]}” is created twice. Remove the second let or const, or use a different name.`],
  [/Cannot access '([^']+)' before initialization/, m => `“${m[1]}” is used before the line that creates it. Move the let or const line higher up.`],
  [/Unexpected end of input|missing \} after|expected expression, got end of script/, () => 'JavaScript reached the end too soon. A closing } or ) is probably missing.'],
  [/Invalid or unexpected token|unterminated string|Unterminated string|illegal character/i, () => 'There’s a character JavaScript doesn’t understand, often a quote mark that isn’t closed.'],
  [/Unexpected token|Unexpected identifier|Unexpected string|Unexpected number|missing \) after|SyntaxError/, () => 'Something is out of place here. Look for a missing comma, bracket or quote mark just before it.'],
  [/Maximum call stack size exceeded|too much recursion/, () => 'A function keeps calling itself and never stops.'],
  [/is not iterable/, () => 'You can only loop over lists like arrays or strings with for…of.'],
  [/^Script error\.?$/, () => 'An error happened in code loaded from another website, so the browser hides the details.'],
  [/Failed to fetch|NetworkError/, () => 'The page couldn’t reach that address. Check it, and that the site allows requests from other pages.']
];
function explain(msg) {
  for (const [re, f] of EXPLAIN) { const m = re.exec(msg); if (m) return f(m); }

}

function exportPage() {
  const html = editors.html.getValue().replace(/\s+$/, ''), css = editors.css.getValue().replace(/\s+$/, ''), js = editors.js.getValue().replace(/\s+$/, '');
  const name = (current.name || 'My page').replace(/[<>&]/g, '');
  const ind = (s, n) => s.split('\n').map(l => l ? ' '.repeat(n) + l : l).join('\n');
  if (/<!doctype|<html[\s>]/i.test(html)) {
    let doc = html;
    if (css.trim()) doc = /<\/head>/i.test(doc) ? doc.replace(/<\/head>/i, `  <style>\n${ind(css, 4)}\n  </style>\n</head>`) : `<style>\n${css}\n</style>\n` + doc;
    if (js.trim()) doc = /<\/body>/i.test(doc) ? doc.replace(/<\/body>(?![\s\S]*<\/body>)/i, `  <script>\n${ind(js, 4)}\n  <\/script>\n</body>`) : doc + `\n<script>\n${js}\n<\/script>\n`;
    return doc + '\n';
  }
  return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${name}</title>${css.trim() ? `\n  <style>\n${ind(css, 4)}\n  </style>` : ''}
</head>
<body>
${ind(html, 2)}${js.trim() ? `\n\n  <script>\n${ind(js, 4)}\n  <\/script>` : ''}
</body>
</html>
`;
}
let downloadsNS = null;
try { if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { downloadsNS = d; }, () => {}); } catch (e) {}
function fileName(ext) { return ((current.name || 'my-page').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'my-page') + (ext || '.html'); }
async function saveFile(name, data, mime) {
  if (downloadsNS) {
    try { await downloadsNS.save({ filename: name, data }); toast(`Saved ${name}`); }
    catch (err) { if (!err || err.code !== 'declined') toast('Couldn\u2019t save the file here. Use Copy instead.'); }
    return;
  }
  const blob = new Blob([data], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(`Saving ${name}. If nothing appears, use Copy instead.`);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove(); return ok;
  }
}

function importHTML(text, name) {
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const css = [], js = [];
  doc.querySelectorAll('style').forEach(s => { css.push(dedent(s.textContent)); s.remove(); });
  doc.querySelectorAll('script:not([src])').forEach(s => { if (!s.type || /javascript|module/.test(s.type)) { js.push(dedent(s.textContent)); s.remove(); } });
  const headExtras = Array.from(doc.head.children).filter(n => !/^(META|TITLE)$/.test(n.tagName)).map(n => n.outerHTML);
  const body = dedent(doc.body.innerHTML.replace(/^\s*\n/, ''));
  const html = (headExtras.length ? headExtras.join('\n') + '\n\n' : '') + body.trim() + '\n';
  saveNow(false);
  const p = { id: uid(), name: (doc.title || name || 'Imported page').slice(0, 60), lesson: null, html, css: css.join('\n\n').trim() + '\n', js: js.join('\n\n').trim() + '\n', updated: Date.now() };
  projects.unshift(p);
  openProject(p);
  toast(`Opened ${name}.html as a new project`);
}
function importMarkdown(text, name, file) {
  saveNow(false);
  const p = { id: uid(), name: (name || 'Imported document').slice(0, 60), lesson: null, mode: 'md', file: /\.(md|markdown)$/i.test(file || '') ? file : '', md: text, html: '', css: '', js: '', updated: Date.now() };
  projects.unshift(p);
  openProject(p);
  toast(`Opened ${name} as a Markdown document`);
}
function dedent(s) {
  const lines = s.replace(/^\n+/, '').replace(/\s+$/, '').split('\n');
  const ind = Math.min(...lines.filter(l => l.trim()).map(l => /^\s*/.exec(l)[0].length));
  return isFinite(ind) ? lines.map(l => l.slice(ind)).join('\n') : s;
}

const isMobile = () => window.matchMedia('(max-width: 820px)').matches;
function refreshEditors() { LANGS.forEach(l => editors[l].refresh()); }

function setLayout(mode) {
  settings.layout = mode; saveSettings();
  app.dataset.layout = mode;
  $$('[data-layout-btn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.layoutBtn === mode)));
  if (mode === 'tabs') setTab(activeLangs().includes(settings.tab) ? settings.tab : activeLangs()[0]);
  else LANGS.forEach(l => setCollapsed(l, !!settings.collapsed[l], true));
  setTimeout(refreshEditors, 0);
}
function setTab(lang) {
  settings.tab = lang; saveSettings();
  $$('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === lang)));
  $$('.pane').forEach(p => p.classList.toggle('active', p.dataset.lang === lang));
  setTimeout(() => editors[lang].refresh(), 0);
}
function setCollapsed(lang, yes, quiet) {
  const open = activeLangs().filter(l => l !== lang && !settings.collapsed[l]);
  if (yes && !open.length && !quiet) return;
  settings.collapsed[lang] = yes; saveSettings();
  const pane = $(`.pane[data-lang="${lang}"]`);
  pane.classList.toggle('collapsed', yes && settings.layout === 'stack');
  pane.querySelector('.pane-toggle').setAttribute('aria-expanded', String(!yes));
  setTimeout(refreshEditors, 0);
}

/* ---------- Device sizes ---------- */
const DEVICES = { full: null, tablet: [768, 1024], phone: [375, 667] };
const stage = $('#stage'), wrap = $('#frameWrap');
function fitDevice() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (!sw || !sh) return;
  const d = DEVICES[settings.device];
  if (!d) {
    wrap.classList.remove('device');
    Object.assign(wrap.style, { width: sw + 'px', height: sh + 'px', transform: 'translateX(-50%)' });
    $('#sizeTag').textContent = `${sw} × ${sh}`;
    return;
  }
  const pad = 24;
  const scale = Math.min(1, (sw - pad) / d[0], (sh - pad) / d[1]);
  wrap.classList.add('device');
  Object.assign(wrap.style, { width: d[0] + 'px', height: d[1] + 'px', transform: `translateX(-50%) scale(${scale})` });
  $('#sizeTag').textContent = `${d[0]} × ${d[1]}` + (scale < 1 ? `  ·  shown at ${Math.round(scale * 100)}%` : '');
}
function setDevice(dv) {
  settings.device = dv; saveSettings();
  $$('[data-device]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.device === dv)));
  fitDevice();
}
$$('[data-device]').forEach(b => b.addEventListener('click', () => setDevice(b.dataset.device)));
if (window.ResizeObserver) new ResizeObserver(fitDevice).observe(stage);
window.addEventListener('resize', fitDevice);

/* ---------- Splitters ---------- */
function applySizes() {
  document.documentElement.style.setProperty('--left', settings.left + '%');

}
function drag(el, onMove) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    app.classList.add('dragging');
    const move = ev => onMove(ev);
    const up = () => {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
      app.classList.remove('dragging');
      saveSettings(); refreshEditors();
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });
}
drag($('#splitV'), ev => {
  const r = $('#workspace').getBoundingClientRect();
  settings.left = Math.max(22, Math.min(75, (ev.clientX - r.left) / r.width * 100));
  applySizes(); refreshEditors();
});
drag($('#splitH'), ev => {
  const r = $('#output').getBoundingClientRect();
  settings.con = Math.max(90, Math.min(r.height - 140, r.bottom - ev.clientY));
  applySizes();
});
$('#splitV').addEventListener('keydown', e => {
  const d = e.key === 'ArrowLeft' ? -2 : e.key === 'ArrowRight' ? 2 : 0;
  if (!d) return; e.preventDefault();
  settings.left = Math.max(22, Math.min(75, settings.left + d)); applySizes(); saveSettings(); refreshEditors();
});
$('#splitH').addEventListener('keydown', e => {
  const d = e.key === 'ArrowUp' ? 16 : e.key === 'ArrowDown' ? -16 : 0;

  const r = $('#output').getBoundingClientRect();
  settings.con = Math.max(90, Math.min(r.height - 140, settings.con + d)); applySizes(); saveSettings();
});

/* ======================================================================
   MARKDOWN TOOLS
   ====================================================================== */
function mdWrap(cm, before, after, placeholder) {
  const sel = cm.getSelection();
  if (sel) cm.replaceSelection(before + sel + after);
  else {
    const c = cm.getCursor();
    cm.replaceRange(before + placeholder + after, c);
    cm.setSelection(Pos(c.line, c.ch + before.length), Pos(c.line, c.ch + before.length + placeholder.length));
  }
}
function mdPrefix(cm, makePrefix, pattern) {
  const from = cm.getCursor('from').line, to = cm.getCursor('to').line;
  const all = [];
  for (let l = from; l <= to; l++) all.push(cm.getLine(l));
  const removing = all.every(t => pattern.test(t));
  cm.operation(() => {
    for (let l = from, i = 0; l <= to; l++, i++) {
      const t = cm.getLine(l);
      const m = pattern.exec(t);
      if (removing) cm.replaceRange('', Pos(l, 0), Pos(l, m[0].length));
      else cm.replaceRange(makePrefix(i), Pos(l, 0), Pos(l, m ? m[0].length : 0));
    }
  });
}
function mdBlock(cm, text, selectFrom, selectLen) {
  const c = cm.getCursor();
  const line = cm.getLine(c.line);
  let pre = '';
  if (line.trim()) { pre = '\n\n'; cm.setCursor(Pos(c.line, line.length)); }
  const at = cm.getCursor();
  cm.replaceRange(pre + text, at);
  if (selectFrom != null) {
    const start = cm.indexFromPos(at) + pre.length + selectFrom;
    cm.setSelection(cm.posFromIndex(start), cm.posFromIndex(start + selectLen));
  }
}
const TABLE = '| Heading | Heading |\n| ------- | ------- |\n| Cell    | Cell    |\n| Cell    | Cell    |\n';
function mdAction(kind) {
  const cm = editors.md;
  cm.focus();
  switch (kind) {
    case 'bold': mdWrap(cm, '**', '**', 'bold text'); break;
    case 'italic': mdWrap(cm, '*', '*', 'italic text'); break;
    case 'heading': {
      const l = cm.getCursor().line, t = cm.getLine(l);
      const m = /^(#{1,6})\s+/.exec(t);
      const next = !m ? '## ' : m[1].length === 1 ? '## ' : m[1].length === 2 ? '### ' : '';
      cm.replaceRange(next, Pos(l, 0), Pos(l, m ? m[0].length : 0));
      break;
    }
    case 'link': {
      const sel = cm.getSelection();
      if (/^https?:\/\//.test(sel)) mdWrap(cm, '[link text](', ')', '');
      if (/^https?:\/\//.test(sel)) break;
      const c = cm.getCursor('from');
      const label = sel || 'link text';
      cm.replaceSelection(`[${label}](https://)`);
      if (sel) cm.setSelection(Pos(c.line, c.ch + label.length + 3), Pos(c.line, c.ch + label.length + 11));
      else cm.setSelection(Pos(c.line, c.ch + 1), Pos(c.line, c.ch + 1 + label.length));
      break;
    }
    case 'image': {
      const c = cm.getCursor('from');
      cm.replaceSelection('![describe the picture](https://)');
      cm.setSelection(Pos(c.line, c.ch + 2), Pos(c.line, c.ch + 22));
      break;
    }
    case 'ul': mdPrefix(cm, () => '- ', /^\s*[-*+]\s(?!\[[ xX]\])/); break;
    case 'ol': mdPrefix(cm, i => (i + 1) + '. ', /^\s*\d+\.\s/); break;
    case 'task': mdPrefix(cm, () => '- [ ] ', /^\s*[-*+]\s\[[ xX]\]\s/); break;
    case 'quote': mdPrefix(cm, () => '> ', /^\s*>\s?/); break;
    case 'code': {
      const sel = cm.getSelection();
      if (sel.includes('\n')) cm.replaceSelection('```\n' + sel.replace(/\n$/, '') + '\n```\n');
      else if (sel) mdWrap(cm, '`', '`', '');
      else if (!cm.getLine(cm.getCursor().line).trim()) mdBlock(cm, '```js\n\n```\n', 6, 0);
      else mdWrap(cm, '`', '`', 'code');
      break;
    }
    case 'table': mdBlock(cm, TABLE, 2, 7); break;
    case 'hr': mdBlock(cm, '---\n\n'); break;
  }
}
$$('[data-md]').forEach(b => b.addEventListener('click', () => mdAction(b.dataset.md)));
